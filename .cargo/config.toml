include = ["config-local.toml"]

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32 --log-format defmt"
# rustflags = ["-C", "linker-plugin-lto"]
# linker = "clang-21"
# linker = "lld"
# runner = "socat /dev/ttyACM0,rawer,b115200 STDOUT | defmt-print -e "

[env]
DEFMT_LOG = "debug"
DEP_LV_CONFIG_PATH = { relative = true, value = "." }
CROSS_COMPILE = "xtensa-esp32-elf"
ESP_BACKTRACE_CONFIG_BACKTRACE_FRAMES = "20"
# LV_COMPILE_ARGS = "-flto=full"
# CC = "clang-21"

[build]
rustflags = [
  "-C",
  "link-arg=-nostartfiles",
]
target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]
